services:
  - type: web
    name: imagenarte-web
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        value: https://czbxwswkbvabnvyxqnqj.supabase.co
      - key: SUPABASE_BUCKET
        value: imagenes
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IMAGENARTE_ADMIN_PASSWORD
        sync: false
